{% extends "base.html" %} {% block content %}
<h2>My Applications</h2>
<p><a href="{{ url_for('export_pdf') }}">Download as PDF</a></p>

<form id="add-form">
  <input id="company" placeholder="Company" required />
  <input id="role" placeholder="Job role" required />
  <input id="link" placeholder="Job link (optional)" />
  <input id="notes" placeholder="Notes (optional)" />
  <button type="submit">Add</button>
</form>

<ul id="applications-list">
  {% for app in applications %}
  <li data-id="{{ app.id }}">
    <span class="status">{{ app.status }}</span>
    <strong>{{ app.company }}</strong> - {{ app.role }}
    {% if app.link %}<a href="{{ app.link }}" target="_blank">[link]</a>{% endif %}
    {% if app.notes %}<em>({{ app.notes }})</em>{% endif %}
    <button class="delete-btn">Delete</button>
  </li>
  {% endfor %}
</ul>

<script>
  const STATUSES = {{ statuses | tojson }};
</script>
<script src="{{ url_for('static', filename='js/applications.js') }}"></script>
{% endblock %}
