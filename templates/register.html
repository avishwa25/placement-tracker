{% extends "base.html" %} {% block content %}
<h2>Register</h2>
<form method="POST">
  <input name="name" placeholder="Name" required /><br />
  <input name="email" type="email" placeholder="Email" required /><br />
  <input
    name="password"
    type="password"
    placeholder="Password (min 6)"
    required
  /><br />
  <button type="submit">Create account</button>
</form>
{% endblock %}
